<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>JARVIS — Command Center</title>
<script src="/static/crypto.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        obsidian:'#05070d',    void:'#030509',       onyx:'#0A0F1C',
        graphite:'#0F1627',    slate1:'#141C33',     slate2:'#1A2340',
        cyan1:'#00E5FF',       cyan2:'#3D7EFF',      violet:'#8B6BFF',
        mint:'#40E39F',        amber:'#FFB84E',      crimson:'#FF6B6B',
        ink:'#E8ECF4',         inkmed:'#9AA3B7',     inkdim:'#5F6A82',
      },
      fontFamily: {
        sans:['Inter','ui-sans-serif','system-ui'],
        display:['Space Grotesk','Inter','sans-serif'],
        head:['Orbitron','Space Grotesk','sans-serif'],
        mono:['JetBrains Mono','ui-monospace','monospace'],
      },
      boxShadow: {
        card:'0 24px 70px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04)',
        glow:'0 0 40px rgba(0,229,255,.28)',
        innerGlow:'inset 0 0 40px rgba(0,229,255,.12)',
      },
    }
  }
}
</script>
<style>
  :root{
    --obsidian:#05070d; --void:#030509; --onyx:#0A0F1C;
    --cyan1:#00E5FF; --cyan2:#3D7EFF; --violet:#8B6BFF;
    --mint:#40E39F; --amber:#FFB84E; --crimson:#FF6B6B;
    --ink:#E8ECF4; --inkmed:#9AA3B7; --inkdim:#5F6A82;
    --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.10);
  }
  *,::before,::after{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;box-sizing:border-box}
  html,body{background:var(--obsidian);color:var(--ink);height:100%;margin:0}
  body{overflow:hidden;font-family:Inter,ui-sans-serif,system-ui}
  button{font-family:inherit}

  /* ambient background stack */
  .bg-base{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1400px 820px at 10% -10%, rgba(0,229,255,.085) 0, transparent 55%),
      radial-gradient(1500px 900px at 95% 110%, rgba(61,126,255,.11) 0, transparent 58%),
      radial-gradient(900px 600px at 50% 50%, rgba(139,107,255,.04) 0, transparent 65%),
      linear-gradient(180deg,#05070d 0%,#03040a 100%);
  }
  .bg-grid{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.32;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center, black 28%, transparent 82%);
  }
  .bg-aurora{
    position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(45% 55% at 20% 30%, rgba(0,229,255,.12) 0, transparent 70%),
      radial-gradient(40% 50% at 85% 70%, rgba(139,107,255,.10) 0, transparent 70%),
      radial-gradient(35% 45% at 60% 20%, rgba(61,126,255,.09) 0, transparent 70%);
    filter:blur(40px);
    animation:auroraDrift 42s ease-in-out infinite alternate;
    opacity:.6;
  }
  @keyframes auroraDrift{
    0%{transform:translate(0,0) rotate(0deg) scale(1)}
    50%{transform:translate(-4%,2%) rotate(3deg) scale(1.08)}
    100%{transform:translate(3%,-3%) rotate(-2deg) scale(1.05)}
  }
  .bg-scan{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.3) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
  .stars svg{width:100%;height:100%}

  /* glass surfaces */
  .glass{
    background:linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,.015) 100%);
    border:1px solid var(--line);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 24px 70px -28px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;
  }
  .glass::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.055) 0%, transparent 25%, transparent 100%);
    mask:linear-gradient(180deg,#000 0%, #000 20%, transparent 70%);
    opacity:.6;
  }
  .glass-hv{transition:border-color .22s ease, box-shadow .22s ease, transform .22s cubic-bezier(.19,1,.22,1)}
  .glass-hv:hover{
    border-color:rgba(0,229,255,.32);
    box-shadow:0 28px 80px -22px rgba(0,0,0,.72), 0 0 0 1px rgba(0,229,255,.1), 0 0 36px rgba(0,229,255,.12), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .stroke-cy{position:relative}
  .stroke-cy::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(135deg, rgba(0,229,255,.55) 0%, rgba(61,126,255,.32) 45%, rgba(139,107,255,.18) 75%, rgba(255,255,255,.04) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }

  /* sidebar */
  .sidebar{width:260px;transition:width .34s cubic-bezier(.19,1,.22,1);background:linear-gradient(180deg,rgba(10,15,28,.72) 0%, rgba(5,7,13,.72) 100%)}
  .sidebar.collapsed{width:78px}
  .sidebar.collapsed .lbl-txt,.sidebar.collapsed .brand-word,.sidebar.collapsed .profile-meta,.sidebar.collapsed .eyebrow,.sidebar.collapsed .sidebar-search,.sidebar.collapsed .nav-badge{opacity:0;pointer-events:none}
  .rail-btn{position:relative;transition:color .18s ease, background .18s ease, transform .15s ease;border-radius:12px}
  .rail-btn::before{content:'';position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--cyan1),var(--cyan2));opacity:0;transition:opacity .18s ease;box-shadow:0 0 8px rgba(0,229,255,.6)}
  .rail-btn:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  .rail-btn.active{color:var(--ink);background:linear-gradient(90deg, rgba(0,229,255,.1) 0%, rgba(0,229,255,.02) 100%)}
  .rail-btn.active::before{opacity:1}
  .rail-btn.active svg{filter:drop-shadow(0 0 6px rgba(0,229,255,.55));color:var(--cyan1)}

  /* buttons */
  .btn-cyan{
    background:linear-gradient(135deg,var(--cyan1) 0%, var(--cyan2) 100%);
    color:#041018;border:none;
    box-shadow:0 8px 28px -8px rgba(0,229,255,.55), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .15s ease, box-shadow .2s ease, filter .18s ease;
    font-weight:700;letter-spacing:.06em;
  }
  .btn-cyan:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 12px 32px -8px rgba(0,229,255,.7), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn-cyan:active{transform:translateY(0);filter:brightness(.95)}
  .btn-ghost{
    background:rgba(255,255,255,.035); border:1px solid var(--line2); color:var(--inkmed);
    transition:all .18s ease;
  }
  .btn-ghost:hover{color:var(--ink);border-color:rgba(0,229,255,.38);background:rgba(0,229,255,.06);box-shadow:inset 0 0 20px rgba(0,229,255,.05)}

  /* inputs */
  .glow-input{background:rgba(255,255,255,.032);border:1px solid var(--line2);transition:all .18s ease;color:var(--ink);font-family:inherit}
  .glow-input:focus{border-color:rgba(0,229,255,.55);box-shadow:0 0 0 3px rgba(0,229,255,.1), 0 0 24px rgba(0,229,255,.12); background:rgba(255,255,255,.06); outline:none}
  .glow-input::placeholder{color:var(--inkdim)}

  /* status dots / pulses */
  .dot{width:8px;height:8px;border-radius:9999px;display:inline-block;position:relative}
  .dot.mint{background:var(--mint);box-shadow:0 0 10px rgba(64,227,159,.8)}
  .dot.amber{background:var(--amber);box-shadow:0 0 10px rgba(255,184,78,.7)}
  .dot.crimson{background:var(--crimson);box-shadow:0 0 10px rgba(255,107,107,.7)}
  .dot.cyan{background:var(--cyan1);box-shadow:0 0 10px rgba(0,229,255,.8)}
  .dot.idle{background:var(--inkdim)}
  .dot.pulse::after{content:'';position:absolute;inset:-5px;border-radius:9999px;border:1.5px solid currentColor;opacity:0;animation:dotPulse 2s ease-out infinite;color:inherit}
  @keyframes dotPulse{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.4);opacity:0}}

  /* AI core rings */
  .core-ring{position:absolute;inset:0;border-radius:9999px;border:1px solid rgba(0,229,255,.5);pointer-events:none}
  @keyframes pulseRing{
    0%{transform:scale(.68);opacity:.95}
    80%{transform:scale(2.6);opacity:0}
    100%{transform:scale(2.6);opacity:0}
  }
  .core-ring.r1{animation:pulseRing 3.4s cubic-bezier(.19,1,.22,1) infinite}
  .core-ring.r2{animation:pulseRing 3.4s cubic-bezier(.19,1,.22,1) .55s infinite}
  .core-ring.r3{animation:pulseRing 3.4s cubic-bezier(.19,1,.22,1) 1.1s infinite}
  .core-ring.slow{animation-duration:5s;border-color:rgba(255,184,78,.4)}

  /* orbital particles */
  .orbit{position:absolute;inset:0;animation:spin 18s linear infinite;pointer-events:none}
  .orbit.rev{animation-direction:reverse;animation-duration:26s}
  .orbit .particle{position:absolute;width:5px;height:5px;background:var(--cyan1);border-radius:50%;box-shadow:0 0 10px rgba(0,229,255,.9);top:50%;left:-2.5px;margin-top:-2.5px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* eq bars */
  .eq-bar{display:inline-block;width:3px;margin:0 2px;background:linear-gradient(180deg,var(--cyan1),var(--cyan2));border-radius:3px;transform-origin:50% 100%;animation:barBounce 1.2s ease-in-out infinite;box-shadow:0 0 6px rgba(0,229,255,.55)}
  @keyframes barBounce{0%,100%{transform:scaleY(.26)}50%{transform:scaleY(1)}}

  /* progress */
  .bar-track{height:5px;background:rgba(255,255,255,.055);border-radius:4px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.03)}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan1),var(--cyan2));box-shadow:0 0 12px rgba(0,229,255,.5);position:relative;overflow:hidden;border-radius:4px}
  .bar-fill.mint{background:linear-gradient(90deg,var(--mint),#32bf7f);box-shadow:0 0 12px rgba(64,227,159,.45)}
  .bar-fill.amber{background:linear-gradient(90deg,var(--amber),#FF8E3C);box-shadow:0 0 12px rgba(255,184,78,.45)}
  .bar-fill.crimson{background:linear-gradient(90deg,var(--crimson),#d94f4f);box-shadow:0 0 12px rgba(255,107,107,.45)}
  .bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%, rgba(255,255,255,.3) 50%, transparent 100%);background-size:200% 100%;animation:shimmer 2.6s linear infinite}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

  /* scrollbars */
  .scroll::-webkit-scrollbar{width:7px;height:7px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .scroll::-webkit-scrollbar-thumb:hover{background:rgba(0,229,255,.32)}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* typography helpers */
  .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--inkdim);font-size:10px}
  .page-title{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-size:11px;font-weight:600;letter-spacing:.05em;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.035);color:var(--inkmed);white-space:nowrap}
  .chip.cyan{color:var(--cyan1);border-color:rgba(0,229,255,.32);background:rgba(0,229,255,.08)}
  .chip.mint{color:var(--mint);border-color:rgba(64,227,159,.32);background:rgba(64,227,159,.08)}
  .chip.amber{color:var(--amber);border-color:rgba(255,184,78,.32);background:rgba(255,184,78,.08)}
  .chip.crimson{color:var(--crimson);border-color:rgba(255,107,107,.32);background:rgba(255,107,107,.08)}
  .chip.violet{color:var(--violet);border-color:rgba(139,107,255,.32);background:rgba(139,107,255,.08)}

  /* chat bubbles */
  .msg{max-width:84%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.56;animation:pop .22s cubic-bezier(.19,1,.22,1) both;word-wrap:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .msg-j{align-self:flex-start;background:linear-gradient(180deg,rgba(0,229,255,.08),rgba(0,229,255,.03));border:1px solid rgba(0,229,255,.22);border-bottom-left-radius:4px;box-shadow:0 0 24px -8px rgba(0,229,255,.2)}
  .msg-u{align-self:flex-end;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-bottom-right-radius:4px}
  .msg-sys{align-self:center;font-size:11px;color:var(--inkdim);background:transparent;border:none;letter-spacing:.3px;padding:3px 0;max-width:100%;text-align:center;font-family:'JetBrains Mono',monospace}
  .lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:5px}
  .msg-j .lbl{color:var(--cyan1)}
  .msg-u .lbl{color:var(--inkmed);text-align:right}

  /* file card */
  .msg-file{align-self:flex-end;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:14px;border-bottom-right-radius:4px;padding:12px 15px;display:flex;align-items:center;gap:13px;max-width:84%;animation:pop .22s cubic-bezier(.19,1,.22,1) both}
  .fc-icon{font-size:28px;flex-shrink:0;line-height:1}
  .fc-meta{flex:1;min-width:0}
  .fc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fc-size{font-size:11px;color:var(--inkdim);margin-top:2px}
  .fc-bar-wrap{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:8px;overflow:hidden}
  .fc-bar{height:100%;width:0%;background:var(--cyan1);border-radius:2px;transition:width .12s linear}
  .fc-status{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--inkmed);flex-shrink:0}
  .fc-status.done{color:var(--mint)}
  .fc-status.err{color:var(--crimson)}
  .fc-dl{display:inline-block;margin-top:6px;font-size:11px;color:var(--cyan1);text-decoration:none;font-weight:600}
  .fc-dl:hover{opacity:.82}

  /* toast */
  #toast{position:fixed;top:72px;left:50%;transform:translate(-50%,-8px);background:rgba(64,227,159,.14);border:1px solid rgba(64,227,159,.4);color:var(--mint);font-size:12px;font-weight:700;letter-spacing:1px;padding:9px 22px;border-radius:99px;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;white-space:nowrap;z-index:50;backdrop-filter:blur(12px)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.4);color:var(--crimson)}

  /* recording pulse */
  .recording{animation:micPulse 1.1s ease-in-out infinite}
  @keyframes micPulse{0%,100%{opacity:1;transform:scale(1);box-shadow:inset 0 0 30px rgba(255,107,107,.3), 0 0 44px rgba(255,107,107,.3)}50%{opacity:.7;transform:scale(.97);box-shadow:inset 0 0 30px rgba(255,107,107,.5), 0 0 60px rgba(255,107,107,.45)}}

  /* fade-up on view switch */
  .fade-up{animation:fadeUp .38s cubic-bezier(.19,1,.22,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .stagger > *{animation:fadeUp .4s cubic-bezier(.19,1,.22,1) both}
  .stagger > *:nth-child(1){animation-delay:.03s}
  .stagger > *:nth-child(2){animation-delay:.08s}
  .stagger > *:nth-child(3){animation-delay:.13s}
  .stagger > *:nth-child(4){animation-delay:.18s}
  .stagger > *:nth-child(5){animation-delay:.23s}
  .stagger > *:nth-child(6){animation-delay:.28s}
  .stagger > *:nth-child(7){animation-delay:.33s}
  .stagger > *:nth-child(8){animation-delay:.38s}

  /* responsive */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:39;display:none}
  .scrim.show{display:block}
  @media (max-width: 900px){
    .sidebar{position:fixed !important;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);width:270px !important}
    .sidebar.open{transform:translateX(0)}
    .sidebar .lbl-txt,.sidebar .brand-word,.sidebar .profile-meta,.sidebar .eyebrow,.sidebar .sidebar-search,.sidebar .nav-badge{opacity:1 !important;pointer-events:auto !important}
  }

  /* empty state */
  .empty{padding:48px 20px;text-align:center;color:var(--inkdim);font-size:13px}
  .empty svg{margin:0 auto 10px;display:block;opacity:.4}

  /* data table */
  table.data-table{width:100%;font-size:13px;border-collapse:collapse}
  table.data-table th{text-align:left;padding:12px 14px;color:var(--inkdim);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
  table.data-table td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
  table.data-table tr:last-child td{border-bottom:none}
  table.data-table tr:hover td{background:rgba(255,255,255,.022)}

  /* nav badge */
  .nav-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.28);color:var(--cyan1);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;transition:opacity .2s}

  /* holographic card variant */
  .holo{position:relative;overflow:hidden}
  .holo::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg, transparent 0%, rgba(0,229,255,.1) 20%, transparent 40%, rgba(139,107,255,.08) 70%, transparent 90%);animation:holoSpin 12s linear infinite;pointer-events:none;opacity:.5}
  @keyframes holoSpin{to{transform:rotate(360deg)}}

  /* sparkline container */
  .spark{width:100%;height:28px;display:block}

  /* donut */
  .donut-wrap{position:relative;width:170px;height:170px;margin:0 auto}
  .donut-wrap .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

  /* kanban columns */
  .kanban-col{min-height:180px;border-radius:14px;padding:14px;background:rgba(255,255,255,.018);border:1px solid var(--line)}
  .kanban-col.hot{border-color:rgba(0,229,255,.25);background:rgba(0,229,255,.03)}

  /* search palette dropdown (inline suggestions) */
  .palette-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:rgba(10,15,28,.96);backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);z-index:45;display:none;max-height:300px;overflow-y:auto}
  .palette-drop.show{display:block}
  .palette-item{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--inkmed)}
  .palette-item:hover,.palette-item.sel{background:rgba(0,229,255,.1);color:var(--ink)}

  /* small timeline bullet */
  .tl-dot{position:relative;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
  .tl-dot::after{content:'';position:absolute;top:9px;left:4px;width:1px;height:calc(100% + 12px);background:var(--line);opacity:.6}
  .tl-row:last-child .tl-dot::after{display:none}

  /* ring progress svg helper */
  .ring-progress{transform:rotate(-90deg)}
  .ring-progress circle{fill:none;stroke-width:6}
  .ring-progress .track{stroke:rgba(255,255,255,.08)}
  .ring-progress .fill{stroke:url(#ringGradient);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.19,1,.22,1)}

  /* subtle noise texture overlay */
  .noise{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.025;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

  /* subtle scanline on hero */
  .scan-hero{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,229,255,.025) 0 1px, transparent 1px 3px);mix-blend-mode:screen;opacity:.4}

  /* system metric bar */
  .metric{display:flex;align-items:center;gap:10px;padding:8px 0}

<script>
'use strict';

/* ───────────────────────── Auth ───────────────────────── */
const _authToken  = sessionStorage.getItem('jarvis_token');
const _sessionKey = sessionStorage.getItem('jarvis_key');
if (!_authToken) { location.replace('/login'); }

function _authHeader(){ return { 'Authorization': `Bearer ${_authToken}` }; }
function _authFetch(url, opts = {}){
  opts.headers = Object.assign({}, opts.headers, _authHeader());
  return fetch(url, opts);
}
async function _getJSON(url){
  try{
    const r = await _authFetch(url, {cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  }catch(_){ return null; }
}

/* ─────────────── AES-256-CBC (CryptoJS) ─────────────── */
const _AES_SALT = 'JARVIS-DASHBOARD-v1';
let _aesKey = null;
function _initCrypto(key){
  if(typeof CryptoJS === 'undefined') return false;
  _aesKey = CryptoJS.SHA256(key + _AES_SALT);
  return true;
}
function _encrypt(plaintext){
  if(!_aesKey || typeof CryptoJS === 'undefined') return null;
  try{
    const iv  = CryptoJS.lib.WordArray.random(16);
    const enc = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
      {iv, mode:CryptoJS.mode.CBC, padding:CryptoJS.pad.Pkcs7});
    const ivHex = iv.toString(CryptoJS.enc.Hex);
    const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
    const hex   = ivHex + ctHex;
    const bytes = new Uint8Array(hex.length/2);
    for(let i=0;i<bytes.length;i++) bytes[i] = parseInt(hex.substr(i*2,2), 16);
    return btoa(String.fromCharCode(...bytes));
  }catch{ return null; }
}
const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
(function(){
  const b = document.getElementById('enc-badge');
  if(_encReady){ b.className = 'chip mint'; b.innerHTML = '<span class="dot mint"></span>AES-256'; }
  else         { b.className = 'chip crimson'; b.textContent = 'NO ENC'; }
})();

/* ─────────────── Starfield ─────────────── */
(function(){
  const host = document.querySelector('.stars svg');
  if(!host) return;
  let seed = 1;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed/233280; };
  const w = window.innerWidth, h = window.innerHeight;
  const frag = document.createDocumentFragment();
  host.setAttribute('viewBox',`0 0 ${w} ${h}`);
  for(let i=0;i<70;i++){
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', (rand()*w)|0);
    c.setAttribute('cy', (rand()*h)|0);
    c.setAttribute('r', (rand()*1.1 + .3).toFixed(2));
    c.setAttribute('fill', '#fff');
    c.setAttribute('opacity', (rand()*.55 + .15).toFixed(2));
    frag.appendChild(c);
  }
  host.appendChild(frag);
})();

/* ─────────────── State ─────────────── */
const State = {
  status:   'connecting',
  history:  [],
  metrics:  null,
  server:   null,
  view:     'overview',
  openNav:  false,
  collapsed:false,
  latency:  null,
  voiceOn:  false,
  overview: null,
};

/* ─────────────── Utils ─────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtSize = b => b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const fmtRelative = ts => {
  if(!ts) return '—';
  const d = typeof ts==='string' ? new Date(ts) : new Date(ts*1000);
  if(isNaN(d.getTime())) return String(ts);
  const diff = (Date.now() - d.getTime())/1000;
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<2592000) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString();
};
const fmtDate = ts => {
  if(!ts) return '—';
  const d = typeof ts==='string' ? new Date(ts) : new Date(ts*1000);
  if(isNaN(d.getTime())) return String(ts);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
};
const fmtGreeting = () => {
  const h = new Date().getHours();
  if(h<5)  return 'Working late';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<21) return 'Good evening';
  return 'Good night';
};
let _toastTimer;
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = kind==='err' ? 'show err' : 'show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.className = ''; }, 2600);
}

/* ─────────────── Clock ─────────────── */
function tickClock(){
  const el = document.getElementById('clock');
  const ed = document.getElementById('clock-date');
  if(el){
    const d = new Date();
    el.textContent = d.toLocaleTimeString([], {hour12:false});
    if(ed) ed.textContent = d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short'}).toUpperCase();
  }
}
setInterval(tickClock, 1000); tickClock();

/* ─────────────── Icons ─────────────── */
const I = {
  home:    '<path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/>',
  spark:   '<path d="M12 3v4"/><path d="M12 17v4"/><path d="M4 12H2"/><path d="M22 12h-2"/><path d="m4.9 4.9 2.8 2.8"/><path d="m16.3 16.3 2.8 2.8"/><path d="m4.9 19.1 2.8-2.8"/><path d="m16.3 7.7 2.8-2.8"/><circle cx="12" cy="12" r="3"/>',
  chat:    '<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',
  mic:     '<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 19v3"/>',
  task:    '<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  mem:     '<path d="M12 3a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-1v1a4 4 0 0 1-8 0v-1H7a3 3 0 0 1-3-3v0a3 3 0 0 1 3-3h1V7a4 4 0 0 1 4-4z"/>',
  book:    '<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 4v12a4 4 0 0 0 4 4"/>',
  folder:  '<path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  cal:     '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  users:   '<path d="M17 20v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  cash:    '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 10v4"/><path d="M18 10v4"/>',
  plane:   '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.2.6-.6.5-1.1z"/>',
  bolt:    '<path d="m13 2-9 13h8l-1 7 9-13h-8z"/>',
  plugs:   '<path d="M9 3v6"/><path d="M15 3v6"/><path d="M6 9h12l-1 12H7z"/>',
  chip:    '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/>',
  radar:   '<circle cx="12" cy="12" r="9"/><path d="M12 12 3 3"/><path d="M12 12v9"/>',
  gear:    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  attach:  '<path d="M21 11.5V18a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4h6.5"/><path d="M14 2h7v7"/><path d="m21 2-9 9"/>',
  arrow:   '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const svg = (d, cls='w-[18px] h-[18px] shrink-0') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

/* ─────────────── Navigation registry ─────────────── */
const NAV = {
  primary: [
    { id:'overview',  label:'Overview',    icon:'home'  },
    { id:'assistant', label:'Assistant',   icon:'chat'  },
    { id:'voice',     label:'Voice Deck',  icon:'mic'   },
    { id:'memory',    label:'Memory',      icon:'mem'   },
    { id:'journal',   label:'Journal',     icon:'book'  },
  ],
  exec: [
    { id:'tasks',       label:'Tasks',        icon:'task'   },
    { id:'projects',    label:'Projects',     icon:'folder' },
    { id:'commitments', label:'Commitments',  icon:'spark'  },
    { id:'contacts',    label:'Contacts',     icon:'users'  },
    { id:'calendar',    label:'Calendar',     icon:'cal'    },
    { id:'finance',     label:'Finance',      icon:'cash'   },
    { id:'travel',      label:'Travel',       icon:'plane'  },
  ],
  system: [
    { id:'agents',    label:'AI Agents',    icon:'bolt'  },
    { id:'intelligence', label:'Intelligence', icon:'radar' },
    { id:'plugins',   label:'Plugins · MCP',icon:'plugs' },
    { id:'system',    label:'System',       icon:'chip'  },
    { id:'settings',  label:'Settings',     icon:'gear'  },
  ],
};
function renderNav(){
  const badges = {
    tasks: ()=> State.overview?.todos?.open,
    commitments: ()=> State.overview?.commitments?.due_24h,
    agents: ()=> {
      const t = State.overview?.tasks?.by_status || {};
      return (t.running||0) + (t.planned||0);
    },
  };
  const build = (bucket, host) => {
    host.innerHTML = bucket.map(it => {
      const b = badges[it.id] && badges[it.id]();
      const badge = b ? `<span class="nav-badge">${b}</span>` : '';
      return `<button data-view="${it.id}" class="rail-btn w-full flex items-center gap-3 px-3 py-2.5 text-inkmed">
        ${svg(I[it.icon])}
        <span class="lbl-txt transition-opacity truncate">${esc(it.label)}</span>
        ${badge}
      </button>`;
    }).join('');
  };
  build(NAV.primary, document.getElementById('nav-primary'));
  build(NAV.exec,    document.getElementById('nav-exec'));
  build(NAV.system,  document.getElementById('nav-system'));
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = ()=> go(b.dataset.view);
  });
}
function updateCrumb(){
  const all = [...NAV.primary, ...NAV.exec, ...NAV.system];
  const it = all.find(x=>x.id===State.view);
  document.getElementById('crumb').textContent = it ? it.label : State.view;
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===State.view);
  });
}
function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const sc = document.getElementById('scrim');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  sc.classList.toggle('show', open);
}
function toggleCollapsed(){
  State.collapsed = !State.collapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', State.collapsed);
}

/* ─────────────── Router ─────────────── */
let _goSeq = 0;
const fresh = my => my === _goSeq;
async function go(view){
  const my = ++_goSeq;
  State.view = view || 'overview';

/* ─────────────── WebSocket (chat relay + history) ─────────────── */
const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
let ws = null;
let _wsConnectedAt = 0;
function connectWS(){
  ws = new WebSocket(_wsUrl);
  ws.onopen = ()=>{
    _wsConnectedAt = performance.now();
    pushHistory({type:'sys', text:'Remote session active.'});
    toast('Connected to JARVIS');
  };
  ws.onclose = ()=>{
    setStatus('offline');
    pushHistory({type:'sys', text:'Connection lost — refresh to reconnect.'});
  };
  ws.onerror = ()=> pushHistory({type:'sys', text:'Connection error.'});
  ws.onmessage = (e)=>{
    let m; try{ m = JSON.parse(e.data); }catch{ return; }
    pushHistory(m);
    if(m.type === 'status') setStatus(m.state === 'active' ? 'active' : 'sleeping');
    if(m.type === 'wake')   toast('Wake detected');
    if(m.type === 'file_received') toast('File received!');
  };
}
connectWS();

function pushHistory(m){
  State.history.push(m);
  if(State.history.length > 400) State.history = State.history.slice(-400);
  if(_chatHooks.length){ for(const fn of _chatHooks) try{ fn(m); }catch{} }
  if(_feedHooks.length){ for(const fn of _feedHooks) try{ fn(m); }catch{} }
}

/* ─────────────── Command send ─────────────── */
async function sendCommand(text){
  if(!text) return;
  pushHistory({type:'log', speaker:'user', text});
  const enc  = _encrypt(text);
  const body = enc ? { enc } : { text };
  try{
    await _authFetch('/api/command', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
  }catch{ toast('Send failed','err'); }
}

  pushHistory({type:'sys', text:'Sending wake signal…'});
  try{ await _authFetch('/api/wake',{method:'POST'}); }
  catch{ toast('Wake failed','err'); }
}

/* ─────────────── Chart / viz helpers ─────────────── */
function sparkline(points, opts){
  opts = opts || {};
  const w = opts.w || 120, h = opts.h || 28;
  if(!points || !points.length) points = [0,0];
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max - min) || 1;
  const stride = w / Math.max(1, points.length-1);
  const path = points.map((v,i)=>{
    const x = (i*stride).toFixed(1);
    const y = (h - ((v-min)/range) * (h-4) - 2).toFixed(1);
    return (i===0?'M':'L')+x+' '+y;
  }).join(' ');
  const area = path + ` L${w} ${h} L0 ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="url(#sparkGrad)"/>
    <path d="${path}" stroke="#00E5FF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function ringProgress(pct, size){
  size = size || 54;
  const r = (size/2) - 4;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, Math.max(0, pct/100)));
  return `<svg class="ring-progress" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" class="track"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" class="fill" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
  </svg>`;
}
function donutChart(data, size){
  size = size || 170;
  const r = size/2 - 10;
  const cx = size/2, cy = size/2;
  const total = data.reduce((s,d)=>s+d.v,0) || 1;
  const colors = ['#00E5FF','#3D7EFF','#8B6BFF','#40E39F','#FFB84E','#FF6B6B','#9AA3B7'];
  let a0 = -Math.PI/2;
  const arcs = data.map((d,i)=>{
    const frac = d.v/total;
    const a1 = a0 + frac * Math.PI * 2;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x0 = (cx + r*Math.cos(a0)).toFixed(2), y0 = (cy + r*Math.sin(a0)).toFixed(2);
    const x1 = (cx + r*Math.cos(a1)).toFixed(2), y1 = (cy + r*Math.sin(a1)).toFixed(2);
    const col = d.color || colors[i%colors.length];
    const path = `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
    a0 = a1;
    return `<path d="${path}" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="butt" opacity=".9"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}

            SEND ${svg(I.arrow,'w-3.5 h-3.5')}
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-4 min-w-0">
        <div class="glass rounded-2xl p-5">
          <div class="eyebrow mb-3">Session</div>
          <dl class="text-[13px] space-y-2.5">
            <div class="flex justify-between"><dt class="text-inkdim">State</dt><dd id="sess-state" class="font-semibold">—</dd></div>
            <div class="flex justify-between"><dt class="text-inkdim">Encryption</dt><dd>${_encReady?'<span class="text-mint font-semibold">AES-256</span>':'<span class="text-crimson font-semibold">none</span>'}</dd></div>
            <div class="flex justify-between"><dt class="text-inkdim">Transport</dt><dd class="mono text-[12px]">WS · HTTP${location.protocol==='https:'?'·TLS':''}</dd></div>
            <div class="flex justify-between"><dt class="text-inkdim">Latency</dt><dd class="mono text-[12px]" id="sess-lat">—</dd></div>
          </dl>
        </div>
        <div class="glass rounded-2xl p-5 flex-1 min-h-0 flex flex-col" style="max-height:60vh">
          <div class="flex items-center justify-between mb-2">
            <div class="eyebrow">Tool trace</div>
            <button onclick="go('journal')" class="text-[11px] text-cyan1 hover:underline flex items-center gap-1">Full log ${svg(I.arrow,'w-3 h-3')}</button>
          </div>
          <div id="tool-trace" class="flex-1 overflow-y-auto scroll text-[12px] mono text-inkmed -mr-2 pr-2"></div>
        </div>
        <div class="glass rounded-2xl p-5">
          <div class="eyebrow mb-3">Prompts</div>
          <div class="space-y-1.5">
            ${['what is on my schedule today?','summarise my open projects','any commitments due today?','show me recent journal entries'].map(p=>`
              <button class="w-full text-left rounded-lg px-3 py-2 text-[12.5px] text-inkmed hover:text-ink hover:bg-white/[.03] transition border border-transparent hover:border-white/5" onclick="document.getElementById('inp').value='${esc(p)}';document.getElementById('inp').focus();">${esc(p)}</button>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  const feed   = document.getElementById('feed');
  const inp    = document.getElementById('inp');
  const sendBt = document.getElementById('send-btn');
  const micBt  = document.getElementById('mic-btn');
  const sState = document.getElementById('sess-state');
  const sLat   = document.getElementById('sess-lat');
  const trace  = document.getElementById('tool-trace');

  sState.textContent = State.status;
  if(State.latency) sLat.textContent = State.latency+' ms';

  function bubble(speaker, text){
    const d = document.createElement('div');
    d.className = 'msg '+(speaker==='jarvis'?'msg-j':'msg-u');
    d.innerHTML = `<div class="lbl">${speaker==='jarvis'?'Jarvis':'You'}</div>${esc(text)}`;
    feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
  }
  function sys(text){
    const d = document.createElement('div');
    d.className = 'msg msg-sys'; d.textContent = text;
    feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
  }
  function fileCard(opts){
    const {name, size, direction, id, done, dlUrl, err} = opts;
    const icon = (()=>{
      const ext=(name.split('.').pop()||'').toLowerCase();
      if(['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if(['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext)) return '🎬';
      if(['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext)) return '🎵';
      if(['pdf'].includes(ext)) return '📋';
      if(['doc','docx','txt','md','rtf','odt'].includes(ext)) return '📝';
      if(['xls','xlsx','csv','ods'].includes(ext)) return '📊';
      if(['zip','rar','7z','tar','gz'].includes(ext)) return '📦';
      return '📎';
    })();
    const card = document.createElement('div');
    card.className = 'msg-file';
    if(id) card.id = id;
    card.innerHTML = `
      <div class="fc-icon">${icon}</div>
      <div class="fc-meta">
        <div class="lbl">${direction}</div>
        <div class="fc-name">${esc(name)}</div>
        <div class="fc-size">${fmtSize(size)}</div>
        ${id ? `<div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>` : ''}
        ${dlUrl ? `<a class="fc-dl" href="${dlUrl}" download="${esc(name)}">⬇ Download</a>` : ''}
      </div>
      <div class="fc-status ${done?'done':err?'err':''}" id="${id?id+'_st':''}">${done?'✓':err?'ERR':'0%'}</div>
    `;
    feed.appendChild(card); feed.scrollTop = feed.scrollHeight;
    return card;
  }

  // Replay history
  for(const m of State.history){
    if(m.type==='log') bubble(m.speaker, m.text);
    else if(m.type==='sys') sys(m.text);
    else if(m.type==='file_received'){
      fileCard({name:m.name, size:m.size, direction:'Received', done:true,
        dlUrl:`/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`});
    }
  }

  const live = (m) => {
    if(m.type==='log') bubble(m.speaker, m.text);
    else if(m.type==='sys') sys(m.text);
    else if(m.type==='status'){ sys(`Status → ${m.state}`); sState.textContent = m.state; }
    else if(m.type==='wake') sys('Wake word detected — connecting…');
    else if(m.type==='file_received'){
      fileCard({name:m.name, size:m.size, direction:'Received', done:true,
        dlUrl:`/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`});
    }
    if(m.type==='log' && m.speaker==='jarvis'){
      const d=document.createElement('div');
      d.className='py-1 border-b border-white/5 last:border-b-0';
      d.innerHTML = `<span class="text-cyan1">▸</span> ${esc((m.text||'').slice(0,160))}`;
      trace.appendChild(d); trace.scrollTop = trace.scrollHeight;
    }
  };
  _chatHooks.push(live);
  const detach = () => { const i=_chatHooks.indexOf(live); if(i>=0)_chatHooks.splice(i,1); };
  window.addEventListener('hashchange', detach, {once:true});

  async function send(){
    const t = inp.value.trim();
    if(!t) return;
    inp.value = '';
    bubble('user', t);
    await sendCommand(t);
  }
  sendBt.onclick = send;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){e.preventDefault(); send();} });

  const fileInp = document.getElementById('file-inp');
  fileInp.onchange = () => {
    Array.from(fileInp.files).forEach(uploadFile);
    fileInp.value = '';
  };
  function uploadFile(file){
    const id = 'fc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    fileCard({name:file.name, size:file.size, direction:'Sending', id});
    const xhr = new XMLHttpRequest();
    xhr.open('POST','/api/upload');
    xhr.setRequestHeader('Authorization',`Bearer ${_authToken}`);
    xhr.upload.onprogress = (e)=>{
      if(!e.lengthComputable) return;
      const pct = Math.round(e.loaded/e.total*100);
      const b = document.getElementById(`${id}_bar`); const s = document.getElementById(`${id}_st`);
      if(b) b.style.width = pct+'%'; if(s) s.textContent = pct+'%';
    };
    xhr.onload = ()=>{
      const b = document.getElementById(`${id}_bar`); const s = document.getElementById(`${id}_st`);
      const card = document.getElementById(id);
      if(xhr.status===200){
        let savedName = file.name;
        try{ savedName = JSON.parse(xhr.responseText).name || file.name; }catch{}
        const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
        if(b){ b.style.width='100%'; b.style.background='var(--mint)'; }
        if(s){ s.textContent='✓'; s.className='fc-status done'; }
        const lbl = card.querySelector('.lbl'); if(lbl) lbl.textContent = 'Sent';
        const meta = card.querySelector('.fc-meta');
        if(meta) meta.insertAdjacentHTML('beforeend',
          `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
        toast('File sent');
      } else {
        if(b) b.style.background='#FF6B6B';
        if(s){ s.textContent='ERR'; s.className='fc-status err'; }
        toast('Upload failed','err');
      }
    };
    xhr.onerror = ()=>{
      const s = document.getElementById(`${id}_st`);
      if(s){ s.textContent='ERR'; s.className='fc-status err'; }
      toast('Connection error','err');
    };
    const fd = new FormData(); fd.append('file', file);
    xhr.send(fd);
  }

  wireMic(micBt);
};

/* ───────── Journal ───────── */
Views.journal = async (host, my) => {
  const data = await _getJSON('/api/data/journal?limit=200') || {items:[]};
  if(!fresh(my)) return;
  const items = (data.items||[]).reverse();
  const fmtArgs = a => {
    if(!a || typeof a !== 'object') return '';
    const entries = Object.entries(a).slice(0,4);
    return entries.map(([k,v])=>{
      let s = typeof v === 'string' ? v : JSON.stringify(v);
      if(s.length > 60) s = s.slice(0,58)+'…';
      return `<span class="chip mono"><span class="text-inkdim mr-1">${esc(k)}</span>${esc(s)}</span>`;
    }).join(' ');
  };
  const fmtResult = r => {
    if(r == null) return '';
    const s = typeof r === 'string' ? r : JSON.stringify(r);
    return esc(s.length > 200 ? s.slice(0,198)+'…' : s);
  };
  const colorFor = ev => {
    if(!ev) return {t:'text-inkmed',d:'idle'};
    if(ev.includes('result')) return {t:'text-mint',d:'mint'};
    if(ev.includes('call'))   return {t:'text-cyan1',d:'cyan'};
    if(ev.includes('error'))  return {t:'text-crimson',d:'crimson'};
    return {t:'text-inkmed',d:'idle'};
  };
  host.innerHTML = `
    ${pageHeader('Journal',
      `${items.length} event${items.length===1?'':'s'} recorded today`,
      `<div class="flex gap-1.5">
        <span class="chip cyan"><span class="dot cyan"></span>call</span>
        <span class="chip mint"><span class="dot mint"></span>result</span>
        <span class="chip crimson"><span class="dot crimson"></span>error</span>
      </div>`)}
    <div class="glass rounded-2xl overflow-hidden">
      ${items.length ? `<div class="divide-y divide-white/5">
        ${items.map(ev=>{
          const time = (ev.ts||'').slice(11,19) || '--:--';
          const et = ev.event||'event';
          const c = colorFor(et);
          return `
          <div class="grid grid-cols-[72px_14px_1fr] gap-3 px-4 py-3 hover:bg-white/[.018] transition">
            <div class="mono text-[11.5px] text-inkdim pt-1">${esc(time)}</div>
            <div class="flex items-start pt-1.5"><span class="dot ${c.d}"></span></div>
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap mb-1">
                <span class="text-[10px] uppercase tracking-wider font-bold ${c.t}">${esc(et.replace(/_/g,' '))}</span>
                ${ev.tool ? `<span class="chip">${esc(ev.tool)}</span>` : ''}
              </div>
              ${ev.args ? `<div class="flex flex-wrap gap-1.5 mb-1.5">${fmtArgs(ev.args)}</div>` : ''}
              ${ev.result != null ? `<div class="text-[12.5px] text-inkmed break-words"><span class="text-cyan1">↳</span> ${fmtResult(ev.result)}</div>` : ''}
              ${(!ev.args && !ev.result && ev.text) ? `<div class="text-[13px] text-ink break-words">${esc(ev.text)}</div>` : ''}
            </div>
          </div>`;
        }).join('')}</div>`
      : emptyBlock('No journal entries yet','Tool calls and events will appear here.')}
    </div>
  `;
};

/* ───────────────────── Voice (shared) ───────────────────── */
let _voiceWs=null, _audioCtx=null, _micStm=null, _audioNd=null;

function _f32toPcm16(f32, srcRate){
  let s = f32;
  if(srcRate !== 16000){
    const ratio = srcRate/16000;
    const len = Math.round(f32.length/ratio);
    s = new Float32Array(len);
    for(let i=0;i<len;i++) s[i] = f32[Math.min(Math.round(i*ratio), f32.length-1)];
  }
  const out = new Int16Array(s.length);
  for(let i=0;i<s.length;i++) out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i]*32768)));
  return out.buffer;
}

function wireMic(btn, opts){
  if(!btn) return;
  const big = opts && opts.big;
  const setIdle = () => {
    btn.classList.remove('recording');
    btn.title = 'Voice — tap to speak';
  };
  setIdle();
  btn.onclick = async () => {
    if(_voiceWs){ stopVoice(); setIdle(); return; }
    if(!navigator.mediaDevices?.getUserMedia){
      toast('Microphone API unavailable','err');
      return;
    }
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    }catch(e){
      toast(e.name==='NotAllowedError'?'Microphone denied':'Mic error','err');
      return;
    }
    let ctx;
    try{ ctx = new AudioContext({sampleRate:16000}); } catch(_){ ctx = new AudioContext(); }
    if(ctx.state==='suspended') await ctx.resume();

    const wsP = location.protocol==='https:'?'wss':'ws';
    const w = new WebSocket(`${wsP}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`);
    w.binaryType = 'arraybuffer';
    w.onopen = async () => {
      const rate = ctx.sampleRate;
      const src  = ctx.createMediaStreamSource(stream);
      const code = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
      try{
        const url = URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
        await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
        const nd = new AudioWorkletNode(ctx,'j');
        let buf=[], len=0;
        nd.port.onmessage = e => {
          const chunk = new Int16Array(_f32toPcm16(e.data, rate));
          buf.push(chunk); len += chunk.length;
          if(len >= 1024){
            const out = new Int16Array(len); let off=0;
            for(const c of buf){ out.set(c, off); off += c.length; }
            if(w.readyState===1) w.send(out.buffer);
            buf = []; len = 0;
          }
        };
        src.connect(nd);
        _audioNd = nd;
      }catch(_){
        const sp = ctx.createScriptProcessor(4096,1,1);
        sp.onaudioprocess = e => { if(w.readyState===1) w.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate)); };
        src.connect(sp); sp.connect(ctx.destination);
        _audioNd = sp;
      }
      btn.classList.add('recording');
      btn.title = 'Tap to stop';
      State.voiceOn = true;
      toast('🎤 Live');
    };
    w.onclose = () => stopVoice(setIdle);
    w.onerror = () => { toast('Voice error','err'); stopVoice(setIdle); };
    _voiceWs = w; _audioCtx = ctx; _micStm = stream;
  };
}
function stopVoice(cb){
  try{ _audioNd?.disconnect?.(); }catch{}
  _audioNd=null;
  try{ _audioCtx?.close?.(); }catch{}
  _audioCtx=null;
  if(_micStm){ _micStm.getTracks().forEach(t=>t.stop()); _micStm=null; }
  if(_voiceWs){ const x=_voiceWs; _voiceWs=null; if(x.readyState<2) x.close(); }
  State.voiceOn = false;
  if(typeof cb === 'function') cb();
}

/* ───────────────── Palette (⌘K) ───────────────── */
const paletteEl = document.getElementById('palette');
const paletteDrop = document.getElementById('palette-drop');
function renderPalette(q){
  const all = [...NAV.primary, ...NAV.exec, ...NAV.system];
  q = (q||'').trim().toLowerCase();
  const hits = q ? all.filter(x => x.id.includes(q) || x.label.toLowerCase().includes(q)) : all.slice(0,8);
  if(!hits.length){
    paletteDrop.innerHTML = `<div class="palette-item text-inkdim">No nav match · press Enter to send "${esc(q)}" to JARVIS</div>`;
  } else {
    paletteDrop.innerHTML = hits.map((h,i)=>`<div class="palette-item${i===0?' sel':''}" data-id="${h.id}">${svg(I[h.icon],'w-4 h-4 text-cyan1')}<span>${esc(h.label)}</span></div>`).join('');
    paletteDrop.querySelectorAll('.palette-item').forEach(el=>{
      el.onclick = ()=>{ if(el.dataset.id){ go(el.dataset.id); paletteEl.value=''; paletteEl.blur(); paletteDrop.classList.remove('show'); }};
    });
  }
  paletteDrop.classList.add('show');
}
paletteEl.addEventListener('focus',()=>renderPalette(paletteEl.value));
paletteEl.addEventListener('input',()=>renderPalette(paletteEl.value));
paletteEl.addEventListener('blur',()=>setTimeout(()=>paletteDrop.classList.remove('show'),180));
document.addEventListener('keydown', e=>{
  if((e.key==='k' || e.key==='K') && (e.metaKey || e.ctrlKey)){
    e.preventDefault();
    paletteEl.focus();
    paletteEl.select();
  }
});
paletteEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const q = e.currentTarget.value.trim().toLowerCase();
    const all = [...NAV.primary, ...NAV.exec, ...NAV.system];
    const hit = all.find(x => x.id.includes(q) || x.label.toLowerCase().includes(q));
    if(hit){ go(hit.id); e.currentTarget.value=''; e.currentTarget.blur(); }
    else{ sendCommand(e.currentTarget.value.trim()); e.currentTarget.value=''; toast('Sent to JARVIS'); }
    paletteDrop.classList.remove('show');
  }
  if(e.key==='Escape'){ e.currentTarget.blur(); paletteDrop.classList.remove('show'); }
});

/* ───────────────── Latency probe ───────────────── */
async function probe(){
  const t0 = performance.now();
  const s = await _getJSON('/api/data/status');
  if(!s) return;
  State.server = s;
  const ms = Math.round(performance.now() - t0);
  State.latency = ms;
  const el = document.getElementById('status-latency');
  if(el) el.textContent = ms+'ms';
  const hl = document.getElementById('hero-latency');
  if(hl) hl.textContent = 'latency ' + ms + 'ms';
}
setInterval(probe, 8000);

/* ───────────────── Boot ───────────────── */
renderNav();
const initial = (location.hash || '#overview').replace('#','');
go(initial);
probe();
