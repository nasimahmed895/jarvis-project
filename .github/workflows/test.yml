name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run test suite (unit + integration, excluding GUI-dependent tests)
        run: |
          python -m pytest tests/ \
              --ignore=tests/integration \
              --tb=short

      - name: Run pipeline integration tests
        run: |
          python -m pytest tests/integration/ --tb=short

  smoke-import:
    # Minimal sanity run that the new agent-assistant modules import
    # cleanly on a stock Python with only the CI deps. Catches typos
    # in the module tree before the test matrix even starts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Import every new core module
        run: |
          python - <<'PY'
          import importlib
          mods = [
              "core.secrets", "core.crm", "core.gatekeeper", "core.decide",
              "core.finance", "core.commitments", "core.projects",
              "core.travel", "core.session_store",
              "actions.crm", "actions.gatekeeper", "actions.decide",
              "actions.finance", "actions.commitments", "actions.meeting_prep",
              "actions.report_gen", "actions.project", "actions.morning_briefing",
              "actions.birthdays", "actions.travel", "actions.timezone_util",
          ]
          for m in mods:
              importlib.import_module(m)
              print("OK", m)
          PY
